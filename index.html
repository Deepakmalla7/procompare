  dark:{icon:"🌙",label:"Dark",desc:"Easy on the eyes",

    a:"#00E5CC",b:"#FF8C42",ap:"rgba(0,229,204,.1)",bp:"rgba(255,140,66,.1)",accent:"#00E5CC",

  sepia:{icon:"📖",label:"Sepia",desc:"Warm, book-like tone",
    bg:"#F4ECD8",sidebar:"#EDE3CA",card:"#FAF4E6",cardglass:"#FAF4E6",bg2:"#EFE6CF",
    border:"#D4B896",divider:"rgba(139,90,60,.14)",tp:"#3D2B1F",ts:"#7C5C45",tac:"#5A4432",

  night:{icon:"⭐",label:"Night",desc:"OLED-friendly black",
    bg:"#000000",sidebar:"#000000",card:"#0A0A0A",cardglass:"#0A0A0A",bg2:"#0A0A0A",
    border:"rgba(255,255,255,.04)",divider:"rgba(255,255,255,.03)",tp:"#FFFFFF",ts:"#555555",tac:"#888888",
    a:"#00FF88",b:"#FF6600",ap:"rgba(0,255,136,.08)",bp:"rgba(255,102,0,.08)",accent:"#00FF88",
    grid:"rgba(255,255,255,.05)",stripe:"rgba(255,255,255,.02)",glowA:"rgba(0,255,136,.5)",glowB:"rgba(255,102,0,.5)",dot:"transparent",onA:"#000000"},
  midnight:{icon:"🌌",label:"Midnight",desc:"Deep blue, calm reading",
    bg:"#0B1120",sidebar:"#080E1A",card:"#0F1929",cardglass:"rgba(15,25,41,.85)",bg2:"#0c1524",
    border:"rgba(100,149,237,.15)",divider:"rgba(100,149,237,.08)",tp:"#C8D8F8",ts:"#5A7AAA",tac:"#8FA8D8",
    a:"#4DA6FF",b:"#FF8C42",ap:"rgba(77,166,255,.1)",bp:"rgba(255,140,66,.1)",accent:"#6495ED",

  solarized:{icon:"🌞",label:"Solarized",desc:"Ethan Schoonover's palette",
    bg:"#FDF6E3",sidebar:"#EEE8D5",card:"#FDF6E3",cardglass:"#FDF6E3",bg2:"#EEE8D5",

  focus:{icon:"👁️",label:"Focus",desc:"High contrast reading",

window.QG_ORDER=["light","dark","sepia","night","midnight","solarized","focus"];
window.QG_applyVars=function(name){
  var t=window.QG_THEMES[name]||window.QG_THEMES.dark, r=document.documentElement;
  for(var k in t){ if(typeof t[k]==="string"&&k!=="icon"&&k!=="label"&&k!=="desc") r.style.setProperty("--"+k,t[k]); }
  r.setAttribute("data-theme",name);
};
(function(){
  var saved=null; try{saved=localStorage.getItem("qg-theme");}catch(e){}
  if(!saved){ try{ saved=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"; }catch(e){ saved="dark"; } }
  if(!window.QG_THEMES[saved]) saved="dark";

<style>
  :root{ --mono:'JetBrains Mono',monospace; --head:'Rajdhani',sans-serif; --body:'Inter',sans-serif; }
  *{box-sizing:border-box;}
  /* Hover transitions only (theme switches re-resolve vars instantly & correctly;
     transitioning a var-backed background-color leaves persistent elements stuck). */
  .navitem,.tp-row,.btn,.topnav button,.themebtn,.toggle button{transition:background-color .2s ease,color .2s ease,border-color .2s ease;}
  .panel{transition:border-color .2s ease;}
  html,body{margin:0;padding:0;}
  body{background-color:var(--bg);color:var(--tp);font-family:var(--body);font-size:14px;line-height:1.5;
       background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:6px;}
  a{color:var(--a);text-decoration:none;}
  .up{text-transform:uppercase;letter-spacing:.15em;} .mono{font-family:var(--mono);} .head{font-family:var(--head);}

  .topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:60;background:var(--sidebar);
          border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .grid-ic{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;}
  .logo .grid-ic i{background:var(--a);border-radius:2px;opacity:.9;}
  .logo .grid-ic i:nth-child(2){background:var(--b);} .logo .grid-ic i:nth-child(3){background:var(--b);}
  .logo b{font-family:var(--head);font-weight:700;letter-spacing:.1em;color:var(--a);font-size:16px;}
  .topnav{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .topnav button{background:none;border:0;color:var(--ts);font-family:var(--head);font-weight:600;letter-spacing:.12em;
                 text-transform:uppercase;font-size:12px;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;}
  .topnav button:hover{color:var(--tp);} .topnav button.on{color:var(--a);border-bottom-color:var(--a);}
  .topnav .ic{color:var(--ts);font-size:15px;padding:8px;}
  .themebtn{cursor:pointer;color:var(--ts);font-size:18px;padding:6px 9px;border-radius:8px;user-select:none;}
  .themebtn:hover{color:var(--a);background:var(--ap);}
  .themepanel{position:fixed;top:56px;right:14px;width:238px;background:var(--card);border:1px solid var(--border);
              border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.35);padding:8px;z-index:100;}
  .tp-h{font-family:var(--head);font-weight:700;letter-spacing:.08em;color:var(--tp);padding:8px 10px 4px;font-size:13px;text-transform:uppercase;}
  .tp-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;}
  .tp-row:hover,.tp-row.on{background:var(--ap);}
  .tp-ic{font-size:15px;width:18px;text-align:center;}
  .tp-name{font-weight:600;color:var(--tp);font-size:13px;line-height:1.1;}
  .tp-desc{color:var(--ts);font-size:10.5px;}
  .tp-dots{margin-left:auto;display:flex;gap:3px;align-items:center;}
  .tp-dots i{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .tp-check{color:var(--a);font-weight:700;margin-left:2px;}
  .tp-f{color:var(--ts);font-size:10.5px;text-align:center;padding:8px 0 4px;border-top:1px solid var(--divider);margin-top:6px;font-family:var(--mono);letter-spacing:.05em;}

  .sidebar{position:fixed;top:60px;left:0;bottom:0;width:250px;background:var(--sidebar);
           border-right:1px solid var(--border);overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;}
  .sidebar .head-lbl{padding:6px 20px;color:var(--ts);font-size:10px;font-family:var(--head);font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
  .sidebar .sub-lbl{padding:0 20px 12px;color:var(--ts);opacity:.7;font-size:10px;letter-spacing:.15em;text-transform:uppercase;}
  .navitem{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--ts);cursor:pointer;border-left:3px solid transparent;font-size:13px;}
  .navitem .ic{width:18px;text-align:center;font-size:15px;}
  .navitem:hover{background:var(--ap);color:var(--tac);}
  .navitem.on{background:var(--ap);color:var(--a);border-left-color:var(--a);font-weight:600;}
  .sidebar .spacer{flex:1;}
  .engine{margin:14px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;}
  .engine .v1{color:var(--ts);font-size:10px;letter-spacing:.15em;text-transform:uppercase;}
  .engine .v2{color:var(--tp);font-weight:700;font-family:var(--head);letter-spacing:.08em;margin-top:2px;}
  .engine .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a);margin-right:6px;box-shadow:0 0 8px var(--a);}

  .main{margin-left:250px;margin-top:60px;padding:22px 26px 90px;min-height:calc(100vh - 60px);}
  .sec-title{font-family:var(--head);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:var(--tp);display:flex;align-items:center;gap:9px;margin:0 0 14px;}
  .sec-title .ic{color:var(--a);}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:980px){.split{grid-template-columns:1fr;}}
  .panel{background:var(--cardglass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;}
  .panel:hover{border-color:var(--a);}
  .panel h3{margin:0 0 16px;font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--tac);display:flex;align-items:center;gap:8px;}
  .panel h3 .r{margin-left:auto;color:var(--ts);font-size:13px;}
  .desc{font-style:italic;color:var(--ts);font-size:12.5px;line-height:1.6;margin-top:16px;border-top:1px solid var(--divider);padding-top:12px;}

  .hero{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:18px;padding:28px 32px;margin-bottom:22px;display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center;}
  @media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center;}}
  .pl{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .photo{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--bg2);}
  .photo.wrapA{border:3px solid var(--a);box-shadow:0 0 25px var(--glowA);}
  .photo.wrapB{border:3px solid var(--b);box-shadow:0 0 25px var(--glowB);}
  .initials{display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:34px;letter-spacing:.05em;}
  .initials.a{color:var(--a);background:radial-gradient(circle at 50% 40%,var(--ap),transparent);}
  .initials.b{color:var(--b);background:radial-gradient(circle at 50% 40%,var(--bp),transparent);}
  .pl .nm{font-family:var(--head);font-weight:700;letter-spacing:.15em;font-size:26px;}
  .pl.a .nm{color:var(--a);} .pl.b .nm{color:var(--b);}
  .pl .role{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ts);text-transform:uppercase;}
  .vs-mid{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .vs-mid .vs{font-family:var(--head);font-weight:700;font-size:46px;color:var(--tp);opacity:.4;}
  .pill{background:var(--bg2);border:1px solid var(--border);color:var(--tp);border-radius:999px;padding:8px 12px;font-size:12px;font-family:var(--mono);min-width:170px;}
  select.pill{cursor:pointer;}
  .btn{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;border:1px solid var(--a);background:transparent;color:var(--a);border-radius:999px;padding:9px 16px;cursor:pointer;}
  .btn:hover{background:var(--a);color:var(--onA);box-shadow:0 0 18px var(--glowA);}
  .toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;}
  .toggle button{background:none;border:0;color:var(--ts);padding:7px 13px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;text-transform:uppercase;}
  .toggle button.on{background:var(--ap);color:var(--a);}

  .gauge-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  .gwrap{text-align:center;}
  .glabel{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ts);text-transform:uppercase;margin-top:6px;}
  .statcircle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid;margin:0 auto;}
  .statcircle.a{border-color:var(--a);} .statcircle.b{border-color:var(--b);}
  .statcircle .n{font-family:var(--mono);font-weight:700;font-size:26px;}
  .statcircle.a .n{color:var(--a);} .statcircle.b .n{color:var(--b);}
  .statcircle .c{font-size:9px;color:var(--ts);letter-spacing:.1em;text-transform:uppercase;padding:0 8px;margin-top:3px;}

  table.dt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;}
  table.dt th,table.dt td{padding:9px 10px;text-align:right;}
  table.dt th:first-child,table.dt td:first-child{text-align:left;}
  table.dt thead th{color:var(--ts);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border);}
  table.dt tbody tr{border-bottom:1px solid var(--divider);}
  table.dt td.va{color:var(--a);font-weight:700;} table.dt td.vb{color:var(--b);font-weight:700;}
  .rowA{background:var(--ap);} .rowB{background:var(--bp);}

  .badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:6px;font-weight:700;}
  .badge.a{background:var(--ap);color:var(--a);} .badge.b{background:var(--bp);color:var(--b);}
  .badge.ok{background:rgba(46,204,113,.14);color:#2ecc71;} .badge.warn{background:var(--bp);color:var(--b);}

  .ahp-row{display:grid;grid-template-columns:150px 46px 1fr;gap:10px;align-items:center;margin:8px 0;font-family:var(--mono);font-size:11.5px;}
  .ahp-row .lbl{color:var(--tac);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;}
  .ahp-bar{height:9px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--divider);}
  .ahp-bar>i{display:block;height:100%;background:var(--a);border-radius:5px;}

  input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:5px;background:linear-gradient(90deg,var(--a) 63%,var(--b) 63%);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--tp);border:3px solid var(--a);cursor:pointer;box-shadow:0 0 10px var(--glowA);}
  .scenario{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .scenario .sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
  .scenario .sc .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ts);text-transform:uppercase;}
  .scenario .sc .v{font-family:var(--head);font-weight:700;margin-top:4px;}

  .pct{display:grid;grid-template-columns:1fr 120px 1fr;gap:6px;align-items:center;margin:9px 0;font-family:var(--mono);font-size:11px;}
  .pct .lab{text-align:center;color:var(--ts);letter-spacing:.06em;text-transform:uppercase;font-size:10px;}
  .pct .baro{height:14px;background:var(--bg2);border-radius:7px;overflow:hidden;position:relative;border:1px solid var(--divider);}
  .pct .baro.la>i{position:absolute;right:0;top:0;bottom:0;background:var(--a);border-radius:7px;}
  .pct .baro.lb>i{position:absolute;left:0;top:0;bottom:0;background:var(--b);border-radius:7px;}
  .pct .num{font-weight:700;} .pct .num.a{color:var(--a);text-align:right;} .pct .num.b{color:var(--b);text-align:left;}

  .simrow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  @media(max-width:900px){.simrow{grid-template-columns:repeat(2,1fr);}}
  .simcard{background:var(--cardglass);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
  .simcard .ph{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:18px;}
  .simcard .nm{font-family:var(--mono);font-size:11.5px;color:var(--tp);}
  .simcard .era{font-size:9px;color:var(--ts);letter-spacing:.1em;text-transform:uppercase;margin:3px 0 8px;}
  .simcard .sbar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;} .simcard .sbar>i{display:block;height:100%;background:var(--a);}
  .simcard .why{font-size:10px;color:var(--ts);margin-top:7px;line-height:1.5;}

  .drop{border:2px dashed;border-radius:14px;padding:22px;text-align:center;}
  .drop.a{border-color:var(--a);} .drop.b{border-color:var(--b);}
  .drop .ic{font-size:26px;} .drop small{display:block;color:var(--ts);margin-top:6px;font-family:var(--mono);font-size:11px;}
  .btn.full{width:100%;border-radius:12px;padding:12px;background:var(--a);color:var(--onA);border:0;margin-top:6px;}
  .btn.full:hover{box-shadow:0 0 22px var(--glowA);}
  .dlrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;} .btn.mini{font-size:10px;padding:7px 10px;}
  .stageflow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;}
  .stagecard{flex:1 1 150px;background:var(--cardglass);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .stagecard .n{width:26px;height:26px;border-radius:50%;background:var(--ap);color:var(--a);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;margin-bottom:8px;}
  .stagecard .t{font-family:var(--head);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--tp);}
  .stagecard .d{font-size:11px;color:var(--ts);margin-top:4px;line-height:1.5;}
  .stagecard .f{font-family:var(--mono);font-size:10px;color:var(--a);margin-top:6px;}

  .verdict{position:fixed;right:18px;bottom:18px;z-index:70;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--a);border-radius:12px;padding:12px 16px;font-family:var(--mono);cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .verdict:hover{border-color:var(--a);} .verdict .t{font-size:11px;letter-spacing:.08em;color:var(--tp);font-weight:700;} .verdict .s{font-size:11px;color:var(--ts);margin-top:2px;}

  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .minicard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .minicard .v{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--tp);}
  .minicard .adv{font-size:11px;color:var(--ts);margin-top:4px;} .minicard .note{font-size:11px;color:var(--tac);font-style:italic;margin-top:6px;}

  var MR={

       photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg/400px-Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg"},

  var state={tab:"dashboard",sec:"overview",mode:"career",a:"Lionel Messi",b:"Cristiano Ronaldo",live:null,sens:63,theme:window.QG_CURRENT||"dark"};

  /* ---------- charts (theme-aware) ---------- */
  function radar(axes,series,size){
    size=size||300; var n=axes.length,cx=size/2,cy=size/2,R=size*0.34;
    function pt(i,v){var a=(-90+i*360/n)*Math.PI/180,r=R*Math.max(0,Math.min(1.05,v));return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
    var g="";
    [0.25,0.5,0.75,1].forEach(function(l){g+='<polygon points="'+axes.map(function(_,i){return pt(i,l).join(",");}).join(" ")+'" fill="none" stroke="'+TH.grid+'" stroke-width="1"/>';});
    for(var i=0;i<n;i++){var e=pt(i,1);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="'+TH.grid+'"/>';}
    series.forEach(function(s){var pts=s.vals.map(function(v,i){return pt(i,v).join(",");}).join(" ");
      g+='<polygon points="'+pts+'" fill="'+s.fill+'" stroke="'+s.color+'" stroke-width="2" '+(s.dash?'stroke-dasharray="4 4"':'')+'/>';});
    for(var j=0;j<n;j++){var lp=pt(j,1.2),a=(-90+j*360/n),c=Math.cos(a*Math.PI/180),an=(Math.abs(c)<0.25?"middle":(c>0?"start":"end"));
      g+='<text x="'+lp[0]+'" y="'+(lp[1]+3)+'" font-size="9.5" fill="'+TH.ts+'" text-anchor="'+an+'" letter-spacing="1">'+esc(axes[j])+'</text>';}
    return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px;display:block;margin:0 auto">'+g+'</svg>';
  }
  function donut(val,max,color,center,sub){
    var W=140,r=54,c=2*Math.PI*r,frac=Math.max(0,Math.min(1,val/max)),off=c*(1-frac);
    return '<svg viewBox="0 0 '+W+' '+W+'" width="130"><circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+TH.grid+'" stroke-width="10"/>'+
      '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 70 70)"/>'+
      '<text x="70" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="'+TH.tp+'">'+center+'</text>'+
      '<text x="70" y="86" text-anchor="middle" font-size="8.5" fill="'+TH.ts+'" letter-spacing="1">'+esc(sub||"")+'</text></svg>';
  }
  function bars(cats,series,h){
    h=h||170; var W=300,pad=30,bw=(W-pad*2)/cats.length,g="";
    var maxv=Math.max.apply(null,series.reduce(function(acc,s){return acc.concat(s.vals);},[0.001]));
    for(var gy=0;gy<=3;gy++){var yy=pad+(h-pad*1.4)*gy/3;g+='<line x1="'+pad+'" y1="'+yy+'" x2="'+(W-pad)+'" y2="'+yy+'" stroke="'+TH.grid+'"/>';}
    cats.forEach(function(cat,i){var x0=pad+bw*i,innerW=bw*0.62,sw=innerW/series.length;
      series.forEach(function(s,si){var v=s.vals[i]||0,bh=(h-pad*1.4)*(v/maxv),x=x0+bw*0.19+sw*si,y=pad+(h-pad*1.4)-bh;
        g+='<rect x="'+x+'" y="'+y+'" width="'+(sw*0.82)+'" height="'+Math.max(0,bh)+'" rx="2" fill="'+s.color+'"'+(s.hatch?' fill-opacity="0.35"':'')+'/>';});
      g+='<text x="'+(x0+bw/2)+'" y="'+(h-6)+'" font-size="8.5" fill="'+TH.ts+'" text-anchor="middle" letter-spacing="1">'+esc(cat)+'</text>';});
    return '<svg viewBox="0 0 '+W+' '+h+'" width="100%">'+g+'</svg>';
  }
  function gumbelCurve(){
    var W=300,H=180,pad=28;
    function pdf(x,mu,be){var z=(x-mu)/be;return Math.exp(-(z+Math.exp(-z)))/be;}
    function curve(mu,be,color){var pts=[];for(var x=0;x<=90;x+=2){var y=pdf(x,mu,be);pts.push([pad+(W-2*pad)*x/90,H-pad-y*1400]);}
      var d="M"+pts.map(function(p){return p[0].toFixed(1)+","+Math.max(pad,p[1]).toFixed(1);}).join(" L");
      return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/><path d="'+d+' L'+(W-pad)+','+(H-pad)+' L'+pad+','+(H-pad)+' Z" fill="'+rgba(color,.08)+'"/>';}
    var g="";for(var i=0;i<=3;i++){var yy=pad+(H-2*pad)*i/3;g+='<line x1="'+pad+'" y1="'+yy+'" x2="'+(W-pad)+'" y2="'+yy+'" stroke="'+TH.grid+'"/>';}
    g+=curve(35,11,B)+curve(38,12,A);
    var mx=pad+(W-2*pad)*73/90;
    g+='<line x1="'+mx+'" y1="'+pad+'" x2="'+mx+'" y2="'+(H-pad)+'" stroke="'+A+'" stroke-dasharray="3 3" stroke-width="1"/>';
    g+='<text x="'+(mx-4)+'" y="'+(pad+10)+'" font-size="8.5" fill="'+A+'" text-anchor="end">73G · 3.4% prob</text>';
    g+='<text x="'+pad+'" y="'+(H-8)+'" font-size="8" fill="'+TH.ts+'">0</text><text x="'+(W-pad)+'" y="'+(H-8)+'" font-size="8" fill="'+TH.ts+'" text-anchor="end">90 goals</text>';
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
  }

    var m=[0.4,1.1,1.32,1.38,1.45,1.36,1.20,1.15,1.13,1.05,0.9],r=[0.5,0.9,1.15,1.40,1.44,1.38,1.10,1.09,0.92,0.7,0.5],maxv=1.6;
    function line(vals,color){var pts=ages.map(function(a,i){return [pad+(W-2*pad)*(a-17)/22,H-pad-(H-2*pad)*(vals[i]/maxv)];});
      return '<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>';}
    var g="";["20-24","25-29","30-34","35+"].forEach(function(lb,i){var x=pad+(W-2*pad)*i/4;g+='<rect x="'+x+'" y="'+pad+'" width="'+((W-2*pad)/4)+'" height="'+(H-2*pad)+'" fill="'+(i%2?TH.stripe:"transparent")+'"/><text x="'+(x+(W-2*pad)/8)+'" y="'+(H-10)+'" font-size="8" fill="'+TH.ts+'" text-anchor="middle">'+lb+'</text>';});
    g+=line(r,B)+line(m,A);return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
  }
  function crossover(sensPct){
    var W=320,H=200,pad=32;
    function messi(w){return 0.805-(0.805-0.5)*(w/0.63);}
    function xf(w){return pad+(W-2*pad)*w;} function yf(v){return H-pad-(H-2*pad)*v;}
    var mp="",rp="";for(var w=0;w<=1.0001;w+=0.02){var mv=Math.max(0.05,Math.min(0.95,messi(w)));mp+=(w===0?"M":"L")+xf(w).toFixed(1)+","+yf(mv).toFixed(1)+" ";rp+=(w===0?"M":"L")+xf(w).toFixed(1)+","+yf(1-mv).toFixed(1)+" ";}
    var cx=xf(0.63);
    var g='<rect x="'+pad+'" y="'+pad+'" width="'+(cx-pad)+'" height="'+(H-2*pad)+'" fill="'+rgba(A,.06)+'"/><rect x="'+cx+'" y="'+pad+'" width="'+(W-pad-cx)+'" height="'+(H-2*pad)+'" fill="'+rgba(B,.06)+'"/>';
    for(var i=0;i<=4;i++){var yy=pad+(H-2*pad)*i/4;g+='<line x1="'+pad+'" y1="'+yy+'" x2="'+(W-pad)+'" y2="'+yy+'" stroke="'+TH.grid+'"/>';}
    g+='<path d="'+mp+'" fill="none" stroke="'+A+'" stroke-width="2.5"/><path d="'+rp+'" fill="none" stroke="'+B+'" stroke-width="2.5"/>';
    g+='<line x1="'+cx+'" y1="'+pad+'" x2="'+cx+'" y2="'+(H-pad)+'" stroke="#ff4d4d" stroke-dasharray="4 3" stroke-width="1.5"/>';
    g+='<text x="'+cx+'" y="'+(pad-6)+'" font-size="9" fill="#ff6b6b" text-anchor="middle">TIPPING POINT 63%</text>';

  }
  function photo(p,side){

  function D(){

  function panel(title,icon,right,body){return '<div class="panel"><h3>'+(icon?icon+' ':'')+esc(title)+(right?'<span class="r">'+right+'</span>':'')+'</h3>'+body+'</div>';}

  function secOverview(d){

  function secAttacking(d){

    return '<div class="split">'+l+r+'</div>';

    el("dlTpl").onclick=function(){download("template.csv",HEAD);};el("dlM").onclick=function(){download("messi_sample.csv",SAMP.m);};el("dlR").onclick=function(){download("ronaldo_sample.csv",SAMP.r);};el("dlMb").onclick=function(){download("mbappe_sample.csv",SAMP.mb);};el("dlH").onclick=function(){download("haaland_sample.csv",SAMP.h);};
    el("csvA").onchange=function(){el("stA").textContent=this.files[0]?this.files[0].name:"no file";};el("csvB").onchange=function(){el("stB").textContent=this.files[0]?this.files[0].name:"no file";};
    el("csvRun").onclick=function(){var msg=el("csvMsg");msg.style.color="var(--ts)";msg.textContent="Reading…";Promise.all([readF(el("csvA")),readF(el("csvB"))]).then(function(t){var ra=parseCSV(t[0]),rb=parseCSV(t[1]);if(!ra||!rb){msg.style.color="#ff6b6b";msg.textContent="Could not parse a CSV.";return;}var va=csvVec(ra),vb=csvVec(rb),na=(el("nameA").value||"Player A"),nb=(el("nameB").value||"Player B");apiRun({command:"head_to_head",mode:"career",vec_a:va.vec,vec_b:vb.vec,name_a:na,name_b:nb,label_a:va.seasons+" rows",label_b:vb.seasons+" rows",season_goals_a:va.sg,season_goals_b:vb.sg,seasons_a:va.seasons,seasons_b:vb.seasons}).then(function(d){if(!d||d.error){msg.style.color="#ff6b6b";msg.textContent=(d&&d.error)||"error";return;}state.live=d;state.a=na;state.b=nb;state.tab="dashboard";state.sec="overview";setTopnav();renderView();window.scrollTo({top:0,behavior:"smooth"});});}).catch(function(e){msg.style.color="#ff6b6b";msg.textContent="Failed: "+e;});};
  }

  /* ---------- THEME SWITCHER ---------- */
  function renderThemeList(){
    el("themeList").innerHTML=window.QG_ORDER.map(function(name,i){var t=window.QG_THEMES[name];
      return '<div class="tp-row'+(state.theme===name?" on":"")+'" data-theme="'+name+'"><span class="tp-ic">'+t.icon+'</span>'+
        '<div><div class="tp-name">'+esc(t.label)+'</div><div class="tp-desc">'+esc(t.desc)+'</div></div>'+
        '<span class="tp-dots"><i style="background:'+t.a+'"></i><i style="background:'+t.b+'"></i></span>'+
        (state.theme===name?'<span class="tp-check">✓</span>':'<span class="tp-desc" style="width:12px;text-align:center">'+(i+1)+'</span>')+'</div>';
    }).join("");
  }
  function applyTheme(name){
    if(!window.QG_THEMES[name])return; state.theme=name; window.QG_CURRENT=name; TH=window.QG_THEMES[name]; syncColors();
    window.QG_applyVars(name); try{localStorage.setItem("qg-theme",name);}catch(e){}
    renderThemeList(); renderView();
  }
  function toggleThemePanel(show){var p=el("themePanel");if(show===undefined)show=p.hasAttribute("hidden");if(show){renderThemeList();p.removeAttribute("hidden");}else p.setAttribute("hidden","");}
  el("themeBtn").onclick=function(e){e.stopPropagation();toggleThemePanel();};
  el("themePanel").onclick=function(e){var r=e.target.closest(".tp-row");if(!r)return;applyTheme(r.getAttribute("data-theme"));toggleThemePanel(false);};
  document.addEventListener("click",function(e){if(!el("themePanel").hasAttribute("hidden")&&!e.target.closest("#themePanel")&&e.target.id!=="themeBtn")toggleThemePanel(false);});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){toggleThemePanel(false);return;}
    var tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="select"||tag==="textarea")return;
    var n=parseInt(e.key,10);if(n>=1&&n<=7){applyTheme(window.QG_ORDER[n-1]);}
  });

  el("topnav").onclick=function(e){var b=e.target.closest("button[data-tab]");if(!b)return;state.tab=b.getAttribute("data-tab");setTopnav();if(state.tab==="dashboard")fetchAndRender();else renderView();};
  el("sidebar").onclick=function(e){var it=e.target.closest(".navitem");if(!it)return;state.tab="dashboard";state.sec=it.getAttribute("data-sec");setTopnav();var d=D();if(!d&&!isMR())fetchAndRender();else renderView();};

  renderNav(); renderThemeList(); fetchAndRender();
})();
</script>
</body>
</html>
